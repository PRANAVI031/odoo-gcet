<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dayflow | My Profile</title>
  <link rel="stylesheet" href="profile.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-left">
      <h2 class="brand">Dayflow</h2>
      <span class="nav-item">Employees</span>
      <span class="nav-item">Attendance</span>
      <span class="nav-item">Time Off</span>
    </div>

    <div class="nav-right">
      <span class="status-dot present"></span>
      <div class="avatar">A</div>
    </div>
  </nav>

  <!-- PROFILE CONTAINER -->
  <div class="profile-container">

    <h2 class="section-title">My Profile</h2>

    <!-- BASIC INFO -->
    <div class="profile-header">
      <div class="profile-pic">
        <span>✎</span>
      </div>

      <div class="basic-info">
        <h3>My Name</h3>

        <div class="info-grid">
          <div><label>Job Position</label><p>Frontend Developer</p></div>
          <div><label>Company</label><p>Dayflow</p></div>

          <div><label>Email</label><p>user@dayflow.com</p></div>
          <div><label>Department</label><p>Engineering</p></div>

          <div><label>Mobile</label><p>9876543210</p></div>
          <div><label>Manager</label><p>John Doe</p></div>
        </div>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <span class="tab active">Resume</span>
      <span class="tab">Private Info</span>
      <span class="tab">Salary Info</span>
      <span class="tab">Security</span>
    </div>

    <!-- DETAILS SECTION -->
    <div class="details-grid">

      <!-- LEFT COLUMN -->
      <div class="details-col">
        <div><label>Date of Birth</label><p>—</p></div>
        <div><label>Residential Address</label><p>—</p></div>
        <div><label>Nationality</label><p>—</p></div>
        <div><label>Personal Email</label><p>—</p></div>
        <div><label>Gender</label><p>—</p></div>
        <div><label>Marital Status</label><p>—</p></div>
        <div><label>Date of Joining</label><p>—</p></div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="details-col">
        <div><label>Bank Details</label><p>—</p></div>
        <div><label>Account Number</label><p>—</p></div>
        <div><label>Bank Name</label><p>—</p></div>
        <div><label>IFSC Code</label><p>—</p></div>
        <div><label>PAN No</label><p>—</p></div>
        <div><label>UAN No</label><p>—</p></div>
        <div><label>Emp Code</label><p>—</p></div>
      </div>

    </div>

  </div>

</body>
</html>
